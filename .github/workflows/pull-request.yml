name: pull-request

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  code:
    uses: justland/.github/.github/workflows/pnpm-verify.yml@main
    with:
      # Nothing in this repo emits coverage - `ts/` holds two exploratory specs
      # and there is no library source - so the upload has nothing to send.
      skip-codecov: true

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
