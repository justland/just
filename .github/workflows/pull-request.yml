name: pull-request

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  code:
    uses: justland/.github/.github/workflows/pnpm-verify.yml@main

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
